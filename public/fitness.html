<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="اختبار اللياقة">
<meta name="theme-color" content="#1B4D8A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>اختبار اللياقة البدنية — عمادة شؤون الطلبة</title>
<style>
  :root{--g:#1B4D8A;--g2:#1B6B3A;--r-ok:#1B6B3A;--r-bad:#8A1F1F;--border:#e3e6e0;--muted:#6b7280;--r:12px;--bg:#f4f6f4}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:#222}
  header{background:var(--g);color:#fff;padding:14px 16px;font-weight:700;font-size:15px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between}
  header .who{font-size:11.5px;font-weight:400;opacity:.9}
  .wrap{max-width:480px;margin:0 auto;padding:14px 12px 40px}
  .card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.04);margin-bottom:12px}
  h1{font-size:15.5px;margin:0 0 4px;color:var(--g)}
  p.sub{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.7}
  label{font-size:12.5px;font-weight:700;display:block;margin-bottom:6px;color:#333}
  input,select{
    width:100%;padding:12px 12px;border:1px solid var(--border);border-radius:var(--r);
    font-size:16px;margin-bottom:14px;-webkit-appearance:none;appearance:none;min-height:48px;
    font-family:inherit;background:#fff
  }
  button{padding:13px;border:none;border-radius:var(--r);background:var(--g);color:#fff;font-size:14.5px;font-weight:700;cursor:pointer;min-height:48px;font-family:inherit}
  button.wide{width:100%}
  button.ghost{background:#fff;color:var(--g);border:1.5px solid var(--g)}
  button:disabled{opacity:.55;cursor:default}
  .err{margin-top:6px;font-size:12.5px;background:#FCEBEB;color:#791F1F;border:1px solid #F3C5C5;border-radius:var(--r);padding:10px 12px}
  .hint{font-size:11.5px;color:var(--muted);background:#EEF3FB;border:1px solid #D6E3F5;border-radius:var(--r);padding:9px 11px;margin-bottom:12px;line-height:1.7}

  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .chip-select{flex:1;min-width:120px}

  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:13px 14px;margin-bottom:8px;cursor:pointer;transition:background .15s}
  .row:active{background:#f0f0f0}
  .row.done{background:#EAF7EF;border-color:#BFE3CC}
  .row .rn{font-size:14px;font-weight:600;color:#222}
  .row .rv{font-size:12px;color:var(--g2);font-weight:700;margin-top:2px}
  .row .re{font-size:11.5px;font-weight:700;color:var(--g);background:#fff;border:1.3px solid var(--g);border-radius:8px;padding:5px 10px;white-space:nowrap}
  .row.done .re{color:var(--r-ok);border-color:var(--r-ok)}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:100}
  .overlay.open{display:flex}
  .sheet{background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:20px 16px 26px;animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sheet h3{margin:0 0 4px;font-size:15px;color:var(--g)}
  .sheet .stu{font-size:13px;color:var(--muted);margin-bottom:14px}
  .sheet .actions{display:flex;gap:10px;margin-top:6px}
  .sheet .actions button{flex:1}

  .topline{display:flex;gap:8px;margin-bottom:10px}
  .badge{font-size:11.5px;background:#EEF3FB;color:var(--g);border-radius:20px;padding:5px 12px;font-weight:700}
  .search{margin-bottom:10px}
  .logout{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;font-size:11px;padding:5px 10px;min-height:0;border-radius:8px}
</style>
</head>
<body>
<header>
  <span>🏃 اختبار اللياقة البدنية</span>
  <span class="who" id="hdr-who" style="display:none"></span>
  <button class="logout" id="hdr-logout" style="display:none" onclick="doLogout()">خروج</button>
</header>
<div class="wrap">

  <!-- شاشة تسجيل الدخول -->
  <div id="scr-login" class="card">
    <h1>تسجيل الدخول</h1>
    <p class="sub">استخدم نفس اسم المستخدم وكلمة المرور المستخدَمَين بنظام العمادة.</p>
    <label>اسم المستخدم</label>
    <input id="lu" type="text" autocomplete="username">
    <label>كلمة المرور</label>
    <input id="lp" type="password" autocomplete="current-password">
    <button class="wide" id="lbtn" onclick="doLogin()">دخول</button>
    <div id="lerr"></div>
  </div>

  <!-- شاشة اختيار المهارة/اللعبة -->
  <div id="scr-setup" style="display:none">
    <div class="card">
      <h1>إعداد جلسة الاختبار</h1>
      <p class="sub">اختاري المهارة واللعبة اللتين ستعملين عليهما الآن. يمكن تغييرهما لاحقاً في أي وقت من هذه الشاشة.</p>
      <label>نوع الفحص (المهارة)</label>
      <select id="setup-skill"></select>
      <label>اللعبة</label>
      <select id="setup-game"></select>
      <label>الجنس</label>
      <select id="setup-gender">
        <option value="">الذكور والإناث معاً</option>
        <option value="ذكر">ذكور فقط</option>
        <option value="أنثى">إناث فقط</option>
      </select>
      <button class="wide" onclick="startSession()">بدء ↩</button>
    </div>
  </div>

  <!-- شاشة قائمة الأسماء -->
  <div id="scr-list" style="display:none">
    <div class="topline">
      <span class="badge" id="lb-skill"></span>
      <span class="badge" id="lb-game"></span>
    </div>
    <input class="search" id="list-q" type="text" placeholder="بحث بالاسم..." oninput="renderList()">
    <button class="ghost wide" style="margin-bottom:12px" onclick="backToSetup()">↺ تغيير المهارة/اللعبة</button>
    <div id="list-body"></div>
  </div>

</div>

<!-- نافذة إدخال القياس -->
<div class="overlay" id="ov">
  <div class="sheet">
    <h3 id="ov-title">إدخال القياس</h3>
    <div class="stu" id="ov-stu"></div>
    <label id="ov-label">القيمة</label>
    <input id="ov-val" type="number" step="0.01" inputmode="decimal">
    <div id="ov-err"></div>
    <div class="actions">
      <button class="ghost" onclick="closeOv()">إلغاء</button>
      <button onclick="saveOv()">موافق ✓</button>
    </div>
  </div>
</div>

<script src="/fitness.js"></script>
</body>
</html>
