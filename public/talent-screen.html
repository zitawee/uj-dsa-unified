<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1B6B3A">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap">
<title>شاشة حضور طلبة التفوق الفني — عمادة شؤون الطلبة</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<style>
  :root{--g:#0F5132;--border:#e3e6e0;--muted:#6b7280;--r:10px}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:#f4f6f4;color:#222}
  header{background:var(--g);color:#fff;padding:12px 16px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px}
  header .sp{flex:1}
  header button{width:auto;min-height:0;padding:6px 14px;font-size:12.5px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4)}
  .wrap{max-width:420px;margin:0 auto;padding:22px 14px}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
  h1{font-size:16px;margin:0 0 14px;color:var(--g)}
  label{font-size:12.5px;font-weight:600;display:block;margin-bottom:6px}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:var(--r);font-size:16px;margin-bottom:14px;min-height:44px;font-family:inherit;background:#fff}
  button{width:100%;padding:13px;border:none;border-radius:var(--r);background:var(--g);color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;min-height:46px;font-family:inherit}
  button:disabled{opacity:.6}
  .err{margin-top:12px;font-size:12.5px;background:#FCEBEB;color:#791F1F;border:1px solid #F3C5C5;border-radius:var(--r);padding:10px;text-align:center}
  #screen{display:none;min-height:calc(100vh - 46px)}
  .scr{display:flex;min-height:calc(100vh - 46px)}
  .qrcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;background:#fff;min-width:0}
  .qrcol .t{font-size:26px;font-weight:800;color:var(--g)}
  .qrcol .s{font-size:15px;color:#666;margin:4px 0 14px}
  .qrcol img{width:min(64vh,50vw);height:min(64vh,50vw);image-rendering:pixelated}
  .list{width:min(340px,38vw);border-right:1px solid var(--border);background:#f8faf8;padding:14px 12px;overflow:auto}
  .list .c{font-size:18px;font-weight:700}
  .it{padding:6px 4px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;font-size:14px}
  .it b{color:var(--g);direction:ltr}
  @media(max-width:700px){.scr{flex-direction:column}.list{width:100%;border-right:0;border-top:1px solid var(--border)}.qrcol img{width:min(80vw,50vh);height:min(80vw,50vh)}}
</style>
</head>
<body>
<header><span>🎓 الجامعة الأردنية — شاشة حضور طلبة التفوق الفني</span><span class="sp"></span><button id="b-sw" style="display:none" onclick="pickAgain()">تغيير النشاط</button><button id="b-out" style="display:none" onclick="logout()">خروج</button></header>

<div class="wrap" id="login"><div class="card">
  <h1>تسجيل الدخول</h1>
  <label>اسم المستخدم</label><input id="un" type="text" autocomplete="username" autocapitalize="none">
  <label>كلمة المرور</label><input id="pw" type="password" autocomplete="current-password">
  <button id="lb" onclick="doLogin()">دخول</button><div id="le"></div>
</div></div>

<div class="wrap" id="pick" style="display:none"><div class="card">
  <h1>اختيار النشاط</h1>
  <label>النشاط</label><select id="act"></select>
  <button onclick="startScreen(document.getElementById('act').value)">عرض شاشة الرمز</button>
</div></div>

<div id="screen"><div class="scr">
  <div class="qrcol"><div class="t" id="s-title"></div><div class="s">امسح الرمز بكاميرا هاتفك ثم أدخل رقمك الجامعي (الدوام ٨:٠٠ – ٣:٠٠)</div><img id="qr" alt=""><div style="font-size:13px;color:#888;margin-top:8px">يتجدد الرمز تلقائياً كل ثوانٍ</div></div>
  <div class="list"><div class="c">زيارات اليوم: <span id="cnt" style="color:var(--g)">0</span></div><div id="vis" style="margin-top:10px"></div></div>
</div></div>

<script>
const LS = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN = LS.get('ts_token'), TIMER = null, ACT = '';
const $ = id => document.getElementById(id);
async function call(url, method, body){
  const r = await fetch(url, { method: method||'GET', headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+(TOKEN||'') }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(()=>({}));
  if (r.status === 401) { showLogin(); return null; }
  d._status = r.status; return d;
}
function show(id){ ['login','pick','screen'].forEach(x => $(x).style.display = x===id ? (x==='screen'?'block':'block') : 'none'); $('b-out').style.display = id==='login' ? 'none' : ''; $('b-sw').style.display = 'none'; }
function showLogin(){ clearInterval(TIMER); TOKEN=null; LS.del('ts_token'); show('login'); }
async function doLogin(){
  const b=$('lb'); b.disabled=true; $('le').innerHTML='';
  try{
    const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('un').value.trim(),password:$('pw').value})});
    const d = await r.json();
    if(!r.ok){ $('le').innerHTML='<div class="err">'+esc(d.error||'تعذّر الدخول')+'</div>'; return; }
    if(!['attendance_screen','admin','editor'].includes(d.user.role)){ $('le').innerHTML='<div class="err">هذا الحساب غير مخوَّل لفتح شاشة الحضور</div>'; return; }
    TOKEN = d.token; LS.set('ts_token', TOKEN); $('pw').value='';
    await afterLogin();
  }catch(e){ $('le').innerHTML='<div class="err">تعذّر الاتصال بالخادم</div>'; }
  finally{ b.disabled=false; }
}
async function afterLogin(){
  const acts = await call('/api/talent-attendance/activities');
  if(!Array.isArray(acts)){ if(acts) { showLogin(); $('le').innerHTML='<div class="err">'+esc(acts.error||'غير مخوَّل')+'</div>'; } return; }
  if(acts.length === 1) return startScreen(acts[0], true);
  $('act').innerHTML = acts.map(a=>`<option>${esc(a)}</option>`).join('');
  show('pick');
}
function pickAgain(){ clearInterval(TIMER); show('pick'); }
async function logout(){ try{ await call('/api/logout','POST'); }catch(e){} showLogin(); }
function startScreen(act, fixed){
  ACT = act; clearInterval(TIMER); show('screen');
  $('s-title').textContent = 'تسجيل الحضور — ' + act;
  $('b-sw').style.display = fixed ? 'none' : '';
  let last = '';
  const tick = async () => {
    const r = await call('/api/talent-attendance/qr-token?activity='+encodeURIComponent(act));
    if(!r || !r.token) return;
    $('cnt').textContent = r.count;
    $('vis').innerHTML = r.visits.map(v=>`<div class="it"><span>${esc(v.name)}</span><b>${esc(v.time.slice(0,5))}</b></div>`).join('') || '<div style="color:#888">لا زيارات بعد</div>';
    if(r.token === last) return; last = r.token;
    QRCode.toDataURL(`${location.origin}/talent-attend.html?a=${encodeURIComponent(act)}&t=${r.token}`, { width:640, margin:1 }, (e,data)=>{ if(!e) $('qr').src = data; });
  };
  tick(); TIMER = setInterval(tick, 2000);
}
['un','pw'].forEach(i => $(i).addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); }));
if(TOKEN) afterLogin(); else show('login');
</script>
</body>
</html>
