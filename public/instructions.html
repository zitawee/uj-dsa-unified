<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B6B3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعليمات النشاط — عمادة شؤون الطلبة</title>
<style>
  :root{--g:#0F5132;--border:#e3e6e0;--muted:#6b7280;--r:10px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:#f4f6f4;color:#222}
  header{background:var(--g);color:#fff;padding:14px 16px;font-weight:600;font-size:14px;position:sticky;top:0;z-index:10}
  .wrap{max-width:620px;margin:0 auto;padding:16px 14px 48px}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.04);margin-bottom:14px}
  h1{font-size:16px;margin:0 0 4px;color:var(--g)}
  p.sub{font-size:12.5px;color:var(--muted);margin:0;line-height:1.6}
  label{font-size:12.5px;font-weight:600;display:block;margin-bottom:6px}
  input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:var(--r);font-size:16px;margin-bottom:10px;font-family:inherit;-webkit-appearance:none;min-height:44px}
  button{width:100%;padding:13px 18px;border:none;border-radius:var(--r);background:var(--g);color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;min-height:46px}
  .msg{margin-top:10px;font-size:12.5px;border-radius:var(--r);padding:10px 12px;display:none;line-height:1.6}
  .err{background:#FCEBEB;color:#791F1F;border:1px solid #F3C5C5}
  .post{border-right:3px solid var(--g);background:#fff;border-radius:8px;padding:12px 14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.04)}
  .post-date{font-size:11px;color:var(--muted);margin-bottom:6px}
  .post-text{font-size:13.5px;line-height:1.8;white-space:pre-wrap}
  .post-link{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--g);word-break:break-all}
  .who-box{background:#EAF3DE;border:1px solid #cfe3bd;border-radius:var(--r);padding:10px 12px;font-size:13px;color:#27500A;margin-bottom:14px}
</style>
</head>
<body>
<header>📋 الجامعة الأردنية — عمادة شؤون الطلبة</header>
<div class="wrap">
  <div class="card">
    <h1 id="pageTitle">تعليمات النشاط</h1>
    <p class="sub" id="pageSub">أدخل رقمك الجامعي للتحقق من تسجيلك، ثم اطّلع على كل التعليمات المنشورة.</p>
  </div>

  <div id="invalidArea" style="display:none">
    <div class="card" style="text-align:center;border-color:#c0392b">
      <div style="font-size:15px;font-weight:700;color:#791F1F">⚠️ الرابط غير صحيح</div>
    </div>
  </div>

  <div id="verifyArea">
    <div class="card">
      <label>الرقم الجامعي *</label>
      <input id="f-uid" type="text" inputmode="numeric" placeholder="أدخل رقمك الجامعي...">
      <button onclick="verify()">عرض التعليمات</button>
      <div class="msg" id="verifyMsg"></div>
    </div>
  </div>

  <div id="postsArea" style="display:none">
    <div class="who-box" id="whoBox"></div>
    <div id="postsList"></div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const BOARD_ID = params.get('board') || '';

function showMsg(id, txt) { const el = document.getElementById(id); el.textContent = txt; el.className = 'msg err'; el.style.display = 'block'; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d) { try { return new Date(d).toLocaleString('ar-JO', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' }); } catch(e) { return ''; } }

async function loadStatus() {
  if (!BOARD_ID) { document.getElementById('invalidArea').style.display = 'block'; document.getElementById('verifyArea').style.display = 'none'; return; }
  try {
    const res = await fetch('/api/public/instructions/' + BOARD_ID + '/status');
    if (!res.ok) { document.getElementById('invalidArea').style.display = 'block'; document.getElementById('verifyArea').style.display = 'none'; return; }
    const s = await res.json();
    document.getElementById('pageTitle').textContent = 'تعليمات: ' + (s.activity_name || '');
  } catch (e) {
    document.getElementById('invalidArea').style.display = 'block';
    document.getElementById('verifyArea').style.display = 'none';
  }
}
loadStatus();

async function verify() {
  const uid = document.getElementById('f-uid').value.trim();
  if (!uid) { showMsg('verifyMsg', 'يرجى إدخال الرقم الجامعي'); return; }
  const res = await fetch('/api/public/instructions/' + BOARD_ID + '/verify', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: uid })
  });
  const data = await res.json();
  if (!res.ok) { showMsg('verifyMsg', data.error || 'حدث خطأ'); return; }
  document.getElementById('verifyArea').style.display = 'none';
  document.getElementById('postsArea').style.display = 'block';
  document.getElementById('whoBox').innerHTML = `أهلاً <b>${esc(data.name)}</b> — إليك كل التعليمات المنشورة لنشاط "${esc(data.activity_name)}".`;
  const list = document.getElementById('postsList');
  if (!data.posts.length) { list.innerHTML = '<div class="card">لا توجد تعليمات منشورة بعد.</div>'; return; }
  list.innerHTML = data.posts.map(p => `
    <div class="post">
      <div class="post-date">${fmtDate(p.posted_at)}</div>
      <div class="post-text">${esc(p.text)}</div>
      ${p.link ? `<a class="post-link" href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.link)}</a>` : ''}
    </div>`).join('');
}
</script>
</body>
</html>
