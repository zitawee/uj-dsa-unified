<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#1B6B3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل حضور — عمادة شؤون الطلبة</title>
<style>
  :root{--g:#0F5132;--border:#e3e6e0;--muted:#6b7280;--r:10px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:#f4f6f4;color:#222}
  header{background:var(--g);color:#fff;padding:14px 16px;font-weight:600;font-size:14px;position:sticky;top:0;z-index:10}
  .wrap{max-width:480px;margin:0 auto;padding:16px 14px 48px}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.04);margin-bottom:14px}
  h1{font-size:17px;margin:0 0 4px;color:var(--g)}
  p.sub{font-size:12.5px;color:var(--muted);margin:0 0 4px;line-height:1.6}
  label{font-size:13px;font-weight:600;display:block;margin-bottom:8px}
  input{
    width:100%;padding:15px 14px;border:1px solid var(--border);border-radius:var(--r);
    font-size:20px;margin-bottom:14px;font-family:inherit;-webkit-appearance:none;appearance:none;
    min-height:52px;text-align:center;letter-spacing:.5px
  }
  .info-box{background:#EAF3DE;border:1px solid #cfe3bd;border-radius:10px;padding:12px 14px;font-size:12.5px;color:#27500A;line-height:1.7;margin-bottom:14px}
  button{
    width:100%;padding:15px 18px;border:none;border-radius:var(--r);background:var(--g);color:#fff;
    font-size:16px;font-weight:700;cursor:pointer;min-height:52px
  }
  button:disabled{opacity:.6;cursor:default}
  .msg{margin-top:10px;font-size:13px;border-radius:var(--r);padding:11px 12px;display:none;line-height:1.7}
  .ok{background:#EAF3DE;color:#27500A;border:1px solid #cfe3bd}
  .err{background:#FCEBEB;color:#791F1F;border:1px solid #F3C5C5}
  .done-box{background:#fff;border:2px solid var(--g);border-radius:12px;padding:30px 18px;text-align:center}
  .center{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px}
  .again{margin-top:14px;background:none;color:var(--g);border:1px solid var(--g);font-weight:600}
</style>
</head>
<body>
<header>🎓 الجامعة الأردنية — عمادة شؤون الطلبة</header>
<div class="wrap">

  <div id="loadingArea" class="card center">جارٍ التحقق من الرابط...</div>

  <div id="invalidArea" style="display:none" class="card center">
    ❌ هذا الرابط غير صالح أو تمت إزالة النشاط المرتبط به. يرجى التواصل مع الجهة المنظِّمة.
  </div>

  <div id="formWrap" style="display:none">
    <div class="card">
      <h1>✅ تسجيل حضور النشاط</h1>
      <div class="info-box" id="activityInfo"></div>
      <label>الرقم الجامعي</label>
      <input id="f-id" type="text" inputmode="numeric" placeholder="أدخل رقمك الجامعي" autofocus>
      <button id="submitBtn" onclick="submitAttend()">تسجيل حضوري</button>
      <div id="msg" class="msg"></div>
    </div>

    <div id="doneArea" style="display:none">
      <div class="done-box">
        <div style="font-size:16px;color:var(--g);font-weight:700" id="doneTitle">✅ تم تسجيل حضورك</div>
        <div style="font-size:13px;color:var(--muted);margin-top:8px" id="doneName"></div>
        <button class="again" onclick="resetForm()">تسجيل طالب آخر</button>
      </div>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const PID = params.get('id');

function v(id){ return document.getElementById(id).value.trim(); }
function showMsg(txt, err){
  const el=document.getElementById('msg');
  el.textContent=txt; el.className='msg '+(err?'err':'ok'); el.style.display='block';
}

async function init(){
  if(!PID){
    document.getElementById('loadingArea').style.display='none';
    document.getElementById('invalidArea').style.display='block';
    return;
  }
  try{
    const res = await fetch('/api/public/participants-info/'+PID);
    const r = await res.json();
    if(!res.ok){
      document.getElementById('loadingArea').style.display='none';
      document.getElementById('invalidArea').style.display='block';
      return;
    }
    document.getElementById('activityInfo').innerHTML =
      `📌 النشاط: <b>${r.activity||'—'}</b><br>📅 التاريخ: <b>${r.date||'—'}</b>` +
      (r.organizer?`<br>🏛️ الجهة المنظِّمة: <b>${r.organizer}</b>`:'');
    document.getElementById('loadingArea').style.display='none';
    document.getElementById('formWrap').style.display='block';
    document.getElementById('f-id').focus();
  }catch(e){
    document.getElementById('loadingArea').style.display='none';
    document.getElementById('invalidArea').style.display='block';
  }
}
init();

function resetForm(){
  document.getElementById('f-id').value='';
  document.getElementById('msg').style.display='none';
  document.getElementById('doneArea').style.display='none';
  document.getElementById('f-id').focus();
}

async function submitAttend(){
  const uniId=v('f-id');
  if(!uniId){ showMsg('يرجى إدخال الرقم الجامعي', true); return; }

  const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='جارٍ التحقق...';
  try{
    const res = await fetch('/api/public/participants/'+PID+'/attend', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ uni_id: uniId })
    });
    const r = await res.json();
    btn.disabled=false; btn.textContent='تسجيل حضوري';
    if(!res.ok){ showMsg(r.error||'تعذر تسجيل الحضور', true); return; }
    document.getElementById('msg').style.display='none';
    document.getElementById('doneTitle').textContent = r.already ? '✅ حضورك مُسجَّل مسبقاً' : '✅ تم تسجيل حضورك بنجاح';
    document.getElementById('doneName').textContent = r.name || '';
    document.getElementById('doneArea').style.display='block';
  }catch(e){
    btn.disabled=false; btn.textContent='تسجيل حضوري';
    showMsg('تعذر الاتصال بالخادم، يرجى المحاولة لاحقاً', true);
  }
}
document.getElementById('f-id')?.addEventListener('keydown', e=>{ if(e.key==='Enter') submitAttend(); });
</script>
</body>
</html>
