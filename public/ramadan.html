<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap">
<title>البرنامج الرمضاني — مقترحات الكليات</title>
<style>
  :root{--g:#0F5132;--border:#e3e6e0;--muted:#6b7280;--r:10px}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:#f4f6f4;color:#222}
  header{background:var(--g);color:#fff;padding:22px 16px;text-align:center}
  header img{max-height:80px;max-width:200px;display:block;margin:0 auto 10px;background:#fff;border-radius:12px;padding:6px}
  header .u{font-size:12px;opacity:.85;margin-bottom:6px}
  header h1{margin:0;font-size:21px;font-weight:800}
  header p{margin:6px 0 0;font-size:13.5px;opacity:.9}
  .wrap{max-width:760px;margin:0 auto;padding:16px 12px 40px}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
  h2{font-size:15px;margin:0 0 12px;color:var(--g)}
  label{font-size:12.5px;font-weight:600;display:block;margin:0 0 5px}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);font:inherit;font-size:15px;margin-bottom:12px;background:#fff}
  textarea{min-height:70px;resize:vertical}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  @media(max-width:560px){.g2{grid-template-columns:1fr}}
  button{padding:12px 18px;border:none;border-radius:var(--r);background:var(--g);color:#fff;font:inherit;font-weight:700;font-size:14.5px;cursor:pointer}
  button.sec{background:#fff;color:var(--g);border:1px solid var(--g)}
  button.del{background:#fff;color:#a32d2d;border:1px solid #e3b4b4;padding:6px 12px;font-size:12.5px}
  button:disabled{opacity:.6}
  .part{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;background:#fafcfa}
  .part .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700;font-size:14px}
  .st{font-size:11.5px;padding:2px 9px;border-radius:99px;background:#eee;font-weight:600}
  .msg{padding:14px;border-radius:var(--r);text-align:center;line-height:1.8;font-size:14px}
  .err{background:#FCEBEB;color:#791F1F;border:1px solid #F3C5C5;margin-top:10px}
  .info{background:#FFF8E5;color:#6b4e00;border:1px solid #F0DDA8}
  .ok{background:#EAF7EE;border:1px solid #BFE5CB}
  .ref{font-size:22px;font-weight:800;color:var(--g);letter-spacing:1px}
  .linkbox{direction:ltr;text-align:left;font-size:12px;word-break:break-all;background:#f4f6f4;padding:8px;border-radius:8px;margin:8px 0}
</style>
</head>
<body>
<header id="hdr"><div class="u">الجامعة الأردنية — عمادة شؤون الطلبة</div><h1>البرنامج الرمضاني</h1><p id="sub"></p></header>
<div class="wrap" id="app"><div class="msg">جارٍ التحميل...</div></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOKEN = new URLSearchParams(location.search).get('t') || '';
let INFO = null, EDIT = null, CAP = null, PARTS = [], PSEQ = 0;
async function j(url, method, body) {
  const r = await fetch(url, { method: method || 'GET', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  try { return await r.json(); } catch (e) { return { error: 'خطأ في الاتصال بالخادم' }; }
}
function fmtD(d) { try { return new Date(d + 'T00:00:00').toLocaleDateString('ar-JO', { year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) { return d; } }
async function init() {
  INFO = await j('/api/public/ramadan/info');
  if (INFO.error) { $('app').innerHTML = `<div class="msg err">${esc(INFO.error)}</div>`; return; }
  document.documentElement.style.setProperty('--g', INFO.color || '#0F5132');
  $('hdr').innerHTML = (INFO.logo ? `<img src="${esc(INFO.logo)}" alt="">` : '<div class="u">الجامعة الأردنية — عمادة شؤون الطلبة</div>') + `<h1>${esc(INFO.title)}</h1><p>${esc(INFO.subtitle)}</p>`;
  document.title = INFO.title;
  let state = INFO.state;
  if (TOKEN) {
    EDIT = await j('/api/public/ramadan/submission/' + encodeURIComponent(TOKEN));
    if (EDIT.error) { $('app').innerHTML = `<div class="msg err">${esc(EDIT.error)}</div>`; return; }
    state = EDIT.state;
  }
  const intro = INFO.intro ? `<div class="card" style="white-space:pre-line;font-size:14px;line-height:1.9">${esc(INFO.intro)}</div>` : '';
  const win = INFO.open_date && INFO.close_date ? `<div style="font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:12px">فترة استقبال المقترحات: ${fmtD(INFO.open_date)} — ${fmtD(INFO.close_date)}</div>` : '';
  if (state === 'not_yet') { $('app').innerHTML = intro + `<div class="msg info">باب استقبال المقترحات لم يُفتح بعد.<br>سيفتح بتاريخ <b>${fmtD(INFO.open_date)}</b></div>`; return; }
  if (state === 'closed') { $('app').innerHTML = intro + `<div class="msg info">انتهت فترة استقبال المقترحات.</div>`; return; }
  $('app').innerHTML = intro + win + formHtml();
  PARTS = EDIT ? EDIT.proposals.map(p => ({ ...p, _k: ++PSEQ })) : [{ _k: ++PSEQ }];
  renderParts();
  if (!EDIT) loadCap();
}
function formHtml() {
  const c = EDIT ? EDIT.contact : {};
  return `<div class="card"><h2>${EDIT ? '✏️ تعديل المقترحات ' + esc(EDIT.ref) : '١. الكلية / الجهة'}</h2>
    ${EDIT ? `<input value="${esc(EDIT.source)}" disabled>` : `<label>الكلية *</label><select id="f-src" onchange="$('f-oth-w').style.display=this.value==='__other'?'block':'none'"><option value="">— اختر الكلية —</option>${INFO.colleges.map(u => `<option>${esc(u)}</option>`).join('')}<option value="__other">جهة أخرى (اكتب الاسم)</option></select>
    <div id="f-oth-w" style="display:none"><label>اسم الجهة *</label><input id="f-oth"></div>`}</div>
  <div class="card"><h2>٢. ضابط الارتباط</h2><div class="g2">
    <div><label>الاسم *</label><input id="f-cn" value="${esc(c.name)}"></div>
    <div><label>المسمى الوظيفي</label><input id="f-ct" value="${esc(c.title)}"></div>
    <div><label>رقم الهاتف *</label><input id="f-cp" type="tel" inputmode="tel" value="${esc(c.phone)}"></div>
    <div><label>البريد الإلكتروني</label><input id="f-ce" type="email" dir="ltr" value="${esc(c.email)}"></div></div></div>
  <div class="card"><h2>٣. المقترحات</h2><div id="parts"></div><button class="sec" type="button" onclick="addPart()">＋ إضافة مقترح آخر</button></div>
  <div class="card"><h2>٤. ملاحظات</h2><textarea id="f-notes" placeholder="اختياري">${esc(EDIT ? EDIT.notes : '')}</textarea></div>
  ${EDIT ? '' : `<div class="card"><label>التحقق: <span id="cap-q"></span> *</label><input id="f-cap" inputmode="numeric" style="max-width:160px"></div>`}
  <div style="text-align:center"><button id="sbtn" onclick="submitForm()" style="min-width:200px">${EDIT ? 'حفظ التعديلات' : 'إرسال المقترحات'}</button><div id="ferr"></div></div>`;
}
async function loadCap() { CAP = await j('/api/public/captcha'); if ($('cap-q')) $('cap-q').textContent = CAP.question || ''; }
const KEYS = ['type','other_text','title','description','audience','expected_count','suggested_date','place','needs'];
function collect() { PARTS.forEach(p => KEYS.forEach(k => { const e = $('p-' + k + '-' + p._k); if (e) p[k] = e.value; })); }
function addPart() { collect(); if (PARTS.length >= 20) return; PARTS.push({ _k: ++PSEQ }); renderParts(); }
function delPart(k) { collect(); if (PARTS.length < 2) return; PARTS = PARTS.filter(p => p._k !== k); renderParts(); }
function renderParts() {
  $('parts').innerHTML = PARTS.map((p, i) => { const k = p._k;
    return `<div class="part"><div class="hd"><span>المقترح ${i + 1} ${p.status ? `<span class="st">${esc(p.status)}</span>` : ''}</span>${PARTS.length > 1 ? `<button class="del" type="button" onclick="delPart(${k})">حذف</button>` : ''}</div>
    <div class="g2"><div><label>نوع المقترح *</label><select id="p-type-${k}" onchange="collect();renderParts()"><option value="">— اختر —</option>${INFO.types.map(f => `<option ${p.type === f ? 'selected' : ''}>${esc(f)}</option>`).join('')}</select></div>
    ${p.type === 'أخرى' ? `<div><label>نوع المقترح (اكتبه) *</label><input id="p-other_text-${k}" value="${esc(p.other_text)}"></div>` : '<div></div>'}</div>
    <label>عنوان المقترح *</label><input id="p-title-${k}" value="${esc(p.title)}">
    <label>وصف مختصر وأهداف</label><textarea id="p-description-${k}">${esc(p.description)}</textarea>
    <div class="g2"><div><label>الفئة المستهدفة</label><input id="p-audience-${k}" value="${esc(p.audience)}" placeholder="طلبة الكلية، طلبة الجامعة..."></div>
    <div><label>العدد المتوقع للحضور</label><input id="p-expected_count-${k}" type="number" min="0" inputmode="numeric" value="${esc(p.expected_count)}"></div>
    <div><label>الموعد المقترح</label><input id="p-suggested_date-${k}" type="date" value="${esc(p.suggested_date)}"></div>
    <div><label>المكان المطلوب</label><input id="p-place-${k}" value="${esc(p.place)}" placeholder="قاعة، مدرج، ساحة..."></div></div>
    <label>الاحتياجات اللوجستية</label><textarea id="p-needs-${k}">${esc(p.needs)}</textarea></div>`; }).join('');
}
async function submitForm() {
  collect();
  const body = { contact: { name: $('f-cn').value, title: $('f-ct').value, phone: $('f-cp').value, email: $('f-ce').value }, notes: $('f-notes').value,
    proposals: PARTS.map(p => { const o = { pid: p.pid }; KEYS.forEach(k => o[k] = p[k]); return o; }) };
  if (!EDIT) { const s = $('f-src').value; if (s === '__other') body.source_other = $('f-oth').value; else body.source = s; body.captcha_token = CAP && CAP.token; body.captcha_answer = $('f-cap').value; }
  $('sbtn').disabled = true; $('ferr').innerHTML = '';
  const r = await j(EDIT ? '/api/public/ramadan/submission/' + encodeURIComponent(TOKEN) : '/api/public/ramadan/submit', EDIT ? 'PUT' : 'POST', body);
  $('sbtn').disabled = false;
  if (r.error) { $('ferr').innerHTML = `<div class="msg err">${esc(r.error)}</div>`; if (!EDIT) { loadCap(); $('f-cap').value = ''; } return; }
  const link = location.origin + '/ramadan.html?t=' + (r.edit_token || TOKEN);
  $('app').innerHTML = `<div class="card msg ok"><div style="font-size:38px">✅</div><b>${EDIT ? 'تم حفظ التعديلات' : 'تم استلام مقترحاتكم'}</b><div>الرقم المرجعي</div><div class="ref">${esc(r.ref)}</div>
    <div style="font-size:13px">ستتواصل معكم دائرة النشاطات الثقافية والحزبية بخصوص المقترحات.</div>
    ${r.edit_token ? `<div style="font-size:13px;margin-top:10px">يمكنكم تعديل المقترحات حتى إغلاق الباب عبر الرابط التالي — <b>احتفظوا به</b>${r.emailed ? ' (أُرسل أيضاً إلى بريدكم)' : ''}:</div><div class="linkbox">${esc(link)}</div><button class="sec" onclick="navigator.clipboard.writeText('${link}');this.textContent='تم النسخ ✓'">نسخ الرابط</button>` : ''}</div>`;
  window.scrollTo(0, 0);
}
init();
</script>
</body>
</html>
