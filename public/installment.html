<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="استعلام التقسيط">
<meta name="theme-color" content="#1B6B3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاستعلام عن نظام تقسيط الرسوم الجامعية — عمادة شؤون الطلبة</title>
<style>
  :root{--g:#0F5132;--border:#e3e6e0;--muted:#6b7280;--r:10px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:#f4f6f4;color:#222}
  header{background:var(--g);color:#fff;padding:14px 16px;font-weight:600;font-size:14px;position:sticky;top:0;z-index:10}
  .wrap{max-width:480px;margin:0 auto;padding:18px 14px 32px}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
  h1{font-size:16px;margin:0 0 4px;color:var(--g)}
  p.sub{font-size:12.5px;color:var(--muted);margin:0 0 16px;line-height:1.6}
  label{font-size:12.5px;font-weight:600;display:block;margin-bottom:6px}
  input{
    width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:var(--r);
    font-size:16px;margin-bottom:14px;-webkit-appearance:none;appearance:none;min-height:44px
  }
  button{width:100%;padding:13px;border:none;border-radius:var(--r);background:var(--g);color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;min-height:46px}
  button:disabled{opacity:.6;cursor:default}
  #result{margin-top:18px}
  .ok-box{background:#EAF7EE;border:1px solid #BFE5CB;border-radius:var(--r);padding:14px;text-align:center}
  .ok-box .icon{font-size:30px;margin-bottom:6px}
  .ok-box .title{font-weight:800;color:var(--g);font-size:15px;margin-bottom:10px}
  .st-line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #d9ecdf;font-size:12.5px;text-align:right}
  .st-line:last-child{border-bottom:none}
  .st-line span{flex-shrink:0;color:var(--muted)}
  .st-line b{color:#173b23;text-align:left}
  .err{margin-top:14px;font-size:12.5px;background:#FCEBEB;color:#791F1F;border:1px solid #F3C5C5;border-radius:var(--r);padding:12px;text-align:center;line-height:1.7}
</style>
</head>
<body>
<header>🎓 الجامعة الأردنية — عمادة شؤون الطلبة</header>
<div class="wrap">
  <div class="card">
    <h1>الاستعلام عن نظام تقسيط الرسوم الجامعية</h1>
    <p class="sub">أدخل رقمك الجامعي للتحقق مما إذا كان اسمك مدرجاً ضمن قائمة الطلبة المقبولين للتقسيط.</p>
    <label>الرقم الجامعي</label>
    <input id="i-sid" type="text" inputmode="numeric" placeholder="أدخل رقمك الجامعي">
    <button id="i-btn" onclick="doCheck()">🔍 تحقق</button>
    <div id="result"></div>
  </div>
</div>
<script>
async function doCheck(){
  const sid = document.getElementById('i-sid').value.trim();
  const btn = document.getElementById('i-btn');
  const box = document.getElementById('result');
  box.innerHTML='';
  if(!sid){ box.innerHTML='<div class="err">يرجى إدخال الرقم الجامعي</div>'; return; }
  btn.disabled=true; btn.textContent='جارٍ التحقق...';
  try{
    const res = await fetch('/api/public/installment-plan?sid='+encodeURIComponent(sid));
    const data = await res.json();
    if(!res.ok){ box.innerHTML = '<div class="err">❌ '+(data.error||'تعذّر التحقق')+'</div>'; return; }
    box.innerHTML = `
      <div class="ok-box">
        <div class="icon">✅</div>
        <div class="title">اسمك مدرج ضمن قائمة المقبولين بنظام التقسيط</div>
        <div class="st-line"><span>الرقم الجامعي</span><b>${data.university_id||'-'}</b></div>
        ${data.college ? `<div class="st-line"><span>الكلية</span><b>${data.college}</b></div>` : ''}
      </div>`;
  }catch(e){
    box.innerHTML = '<div class="err">تعذّر الاتصال بالخادم، يرجى المحاولة لاحقاً</div>';
  }finally{
    btn.disabled=false; btn.textContent='🔍 تحقق';
  }
}
document.getElementById('i-sid').addEventListener('keydown', e=>{ if(e.key==='Enter') doCheck(); });
</script>
</body>
</html>
