<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="فعاليات الطلبة">
<link rel="manifest" href="/events-manifest.json">
<meta name="theme-color" content="#1B6B3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فعاليات الطلبة — عمادة شؤون الطلبة</title>
<meta property="og:title" content="فعاليات الطلبة — عمادة شؤون الطلبة">
<meta property="og:description" content="تصفَّح فعاليات ونشاطات الطلبة القادمة والسابقة في الجامعة الأردنية، وسجّلي مشاركتك مباشرة">
<meta property="og:image" content="https://ju-dsa.up.railway.app/logo.png">
<meta property="og:url" content="https://ju-dsa.up.railway.app/events.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="عمادة شؤون الطلبة — الجامعة الأردنية">
<meta property="og:locale" content="ar_AR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="فعاليات الطلبة — عمادة شؤون الطلبة">
<meta name="twitter:description" content="تصفَّح فعاليات ونشاطات الطلبة القادمة والسابقة في الجامعة الأردنية">
<meta name="twitter:image" content="https://ju-dsa.up.railway.app/logo.png">
<style>
  :root{--g:#0F5132;--g2:#1B6B3A;--border:#e3e6e0;--muted:#6b7280;--r:10px;--bg:#f4f6f4}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:#222}
  header{background:var(--g);color:#fff;padding:16px;text-align:center}
  header .ttl{font-weight:700;font-size:16px}
  header .sub{font-size:11.5px;opacity:.85;margin-top:2px}
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px 48px}
  .searchbar{display:flex;gap:8px;margin-bottom:14px}
  .searchbar input{
    flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r);
    font-size:14px;font-family:inherit;background:#fff
  }
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tab{flex:1;text-align:center;padding:9px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
  .tab.active{background:var(--g);color:#fff;border-color:var(--g)}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.03);transition:.15s}
  .card:active{transform:scale(.99)}
  .card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .card .ttl2{font-weight:700;font-size:14.5px;color:var(--g)}
  .card .date-badge{flex-shrink:0;background:#EAF3DE;color:#27500A;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;white-space:nowrap}
  .card .date-badge.past{background:#F1F2F1;color:var(--muted)}
  .card .meta{font-size:12px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:10px}
  .card .meta span{display:flex;align-items:center;gap:4px}
  .empty{text-align:center;color:var(--muted);padding:50px 10px;font-size:13.5px}
  .center{text-align:center;color:var(--muted);padding:40px 10px}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:2000;padding:16px}
  .modal{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:460px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal .close{float:left;background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted)}
  .modal h2{font-size:16px;color:var(--g);margin:0 0 10px}
  .modal .frow{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
  .modal .frow .lbl{color:var(--muted);min-width:90px;flex-shrink:0}
  .modal .frow .val{font-weight:600;white-space:pre-wrap}
  .modal .reglink{display:block;text-align:center;margin-top:16px;background:var(--g);color:#fff;text-decoration:none;padding:12px;border-radius:10px;font-weight:700;font-size:14px}
  .modal .evallink{background:#1B5E9A;margin-top:10px}
  .modal .instrlink{background:#5B4636;margin-top:10px}
  .modal .sharebtn{display:block;width:100%;text-align:center;margin-top:10px;background:#fff;color:var(--g);border:1px solid var(--g);padding:11px;border-radius:10px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit}
  .modal .noreg{margin-top:16px;text-align:center;font-size:12px;color:var(--muted);background:#F9FAFB;border-radius:10px;padding:12px}

  .install-banner{
    position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);
    box-shadow:0 -4px 16px rgba(0,0,0,.08);padding:14px 16px;z-index:1500;display:none;
    align-items:center;gap:12px;flex-wrap:wrap
  }
  .install-banner img{width:40px;height:40px;border-radius:9px;flex-shrink:0}
  .install-banner .txt{flex:1;min-width:180px;font-size:12.5px;color:#222;line-height:1.5}
  .install-banner .txt b{color:var(--g)}
  .install-banner .btns{display:flex;gap:8px;flex-shrink:0}
  .install-banner button{
    border:none;border-radius:8px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit
  }
  .install-banner .yes{background:var(--g);color:#fff}
  .install-banner .no{background:#F1F2F1;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="ttl">🎓 فعاليات الطلبة</div>
  <div class="sub">الجامعة الأردنية — عمادة شؤون الطلبة</div>
</header>
<div class="wrap">
  <div class="searchbar"><input id="q" placeholder="بحث باسم الفعالية أو الجهة المنظِّمة..." oninput="render()"></div>
  <div class="tabs">
    <div class="tab active" id="tab-upcoming" onclick="setTab('upcoming')">📅 القادمة</div>
    <div class="tab" id="tab-past" onclick="setTab('past')">🗓️ السابقة</div>
    <div class="tab" id="tab-all" onclick="setTab('all')">الكل</div>
  </div>
  <div id="list"><div class="center">جارٍ التحميل...</div></div>
</div>

<div class="install-banner" id="installBanner">
  <img src="/icon-192.png" alt="">
  <div class="txt" id="installBannerTxt"><b>هل ترغب بتثبيت برنامج فعاليات عمادة شؤون الطلبة على جهازك؟</b></div>
  <div class="btns" id="installBannerBtns">
    <button class="yes" onclick="doInstall()">نعم، تثبيت</button>
    <button class="no" onclick="dismissInstallBanner()">لاحقاً</button>
  </div>
</div>

<script>
let EVENTS=[];
let TAB='upcoming';
const todayStr = new Date().toISOString().slice(0,10);

function setTab(t){
  TAB=t;
  ['upcoming','past','all'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('active', x===t));
  render();
}

async function init(){
  try{
    const res = await fetch('/api/public/events');
    EVENTS = await res.json();
  }catch(e){ EVENTS=[]; }
  render();
  const sharedId = new URLSearchParams(location.search).get('id');
  if(sharedId){
    const idx = EVENTS.findIndex(e=>e.id===sharedId);
    if(idx>-1) openDetails(idx);
  }
}

function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  let rows = EVENTS.slice();
  if(TAB==='upcoming') rows = rows.filter(e=>e.date && e.date>=todayStr);
  else if(TAB==='past') rows = rows.filter(e=>e.date && e.date<todayStr);
  if(q) rows = rows.filter(e=>(e.title||'').toLowerCase().includes(q) || (e.organizer||'').toLowerCase().includes(q));
  rows.sort((a,b)=> TAB==='past' ? (b.date||'').localeCompare(a.date||'') : (a.date||'').localeCompare(b.date||''));

  const list = document.getElementById('list');
  if(!rows.length){
    list.innerHTML = `<div class="empty">لا توجد فعاليات ${TAB==='upcoming'?'قادمة':TAB==='past'?'سابقة':''} مطابقة حالياً.</div>`;
    return;
  }
  list.innerHTML = rows.map((e,i)=>{
    const isPast = e.date && e.date<todayStr;
    return `<div class="card" onclick="openDetails(${EVENTS.indexOf(e)})">
      <div class="row1">
        <div class="ttl2">${esc(e.title)||'—'}</div>
        <div class="date-badge${isPast?' past':''}">${e.date||'—'}</div>
      </div>
      <div class="meta">
        <span>🏛️ ${esc(e.organizer)||'—'}</span>
        ${e.type?`<span>🏷️ ${esc(e.type)}</span>`:''}
      </div>
    </div>`;
  }).join('');
}

function esc(s){ return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function openDetails(idx){
  const e = EVENTS[idx]; if(!e) return;
  const existing=document.getElementById('ev-modal'); if(existing) existing.remove();
  history.replaceState(null,'','/events.html?id='+e.id);
  const modal=document.createElement('div');
  modal.id='ev-modal'; modal.className='modal-bg';
  const closeModal=()=>{ modal.remove(); history.replaceState(null,'','/events.html'); };
  modal.onclick=(ev)=>{ if(ev.target===modal) closeModal(); };
  const regHTML = e.participant_id
    ? `<a class="reglink" href="/register.html?id=${e.participant_id}">🔗 التسجيل في هذه الفعالية</a>`
    : `<div class="noreg">التسجيل غير متاح لهذه الفعالية بعد.</div>`;
  const evalHTML = e.eval_id
    ? `<a class="reglink evallink" href="/eval.html?id=${e.eval_id}">📝 تقييم النشاط</a>`
    : '';
  const instrHTML = e.participant_id
    ? `<a class="reglink instrlink" href="/instructions.html?id=${e.participant_id}">📋 تعليمات النشاط</a>`
    : '';
  modal.innerHTML = `
  <div class="modal">
    <button class="close" onclick="document.getElementById('ev-modal').remove();history.replaceState(null,'','/events.html')">✕</button>
    <h2>${esc(e.title)||'—'}</h2>
    <div class="frow"><span class="lbl">التاريخ</span><span class="val">${e.date||'—'}</span></div>
    ${e.time?`<div class="frow"><span class="lbl">الوقت</span><span class="val">${esc(e.time)}</span></div>`:''}
    ${e.location?`<div class="frow"><span class="lbl">المكان</span><span class="val">${esc(e.location)}</span></div>`:''}
    <div class="frow"><span class="lbl">الجهة المنظِّمة</span><span class="val">${esc(e.organizer)||'—'}</span></div>
    ${e.type?`<div class="frow"><span class="lbl">النوع</span><span class="val">${esc(e.type)}</span></div>`:''}
    ${e.goals?`<div class="frow"><span class="lbl">الأهداف</span><span class="val">${esc(e.goals)}</span></div>`:''}
    ${e.description?`<div class="frow"><span class="lbl">الوصف</span><span class="val">${esc(e.description)}</span></div>`:''}
    ${regHTML}
    ${evalHTML}
    ${instrHTML}
    <button class="sharebtn" onclick="shareEvent('${e.id}','${esc(e.title).replace(/'/g,"\\'")}')">🔗 مشاركة هذه الفعالية</button>
  </div>`;
  document.body.appendChild(modal);
}

async function shareEvent(id, title){
  const url = location.origin + '/events.html?id=' + id;
  if(navigator.share){
    try{ await navigator.share({ title, url }); return; }catch(e){ /* المستخدم ألغى المشاركة أو فشلت — نكمل بنسخ الرابط */ }
  }
  try{
    await navigator.clipboard.writeText(url);
    alert('✅ تم نسخ رابط الفعالية — يمكنك لصقه الآن في واتساب أو فيسبوك');
  }catch(e){
    prompt('انسخي هذا الرابط لمشاركته:', url);
  }
}

// ═ تثبيت التطبيق (PWA) على الهاتف ═
let deferredInstallPrompt = null;
const DISMISS_KEY = 'events_install_dismissed_until';

function isDismissed(){
  const until = localStorage.getItem(DISMISS_KEY);
  return until && Date.now() < Number(until);
}
function dismissInstallBanner(days=7){
  document.getElementById('installBanner').style.display='none';
  localStorage.setItem(DISMISS_KEY, Date.now() + days*24*60*60*1000);
}
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}

// أندرويد/Chrome: يعرض المتصفح نفسه فرصة التثبيت، نعترضها لعرض رسالتنا المخصَّصة أولاً
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  if(!isDismissed() && !isStandalone()){
    document.getElementById('installBanner').style.display='flex';
  }
});

async function doInstall(){
  document.getElementById('installBanner').style.display='none';
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
  }
}

// آيفون/Safari: لا تدعم نافذة تثبيت تلقائية إطلاقاً — نعرض إرشاداً بدلاً من ذلك
if(isIOS() && !isStandalone() && !isDismissed()){
  document.getElementById('installBannerTxt').innerHTML = '<b>للتثبيت على هاتفك:</b> اضغطي على زر المشاركة 📤 ثم اختاري "Add to Home Screen"';
  document.getElementById('installBannerBtns').innerHTML = '<button class="no" onclick="dismissInstallBanner()">فهمت</button>';
  document.getElementById('installBanner').style.display='flex';
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/events-sw.js').catch(()=>{});
}

init();
</script>
</body>
</html>
