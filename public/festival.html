<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap">
<title>مهرجان الجامعات الأردنية للفن والثقافة</title>
<style>
  :root{--g:#0F5132;--border:#e3e6e0;--muted:#6b7280;--r:10px}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:#f4f6f4;color:#222}
  header{background:var(--g);color:#fff;padding:22px 16px;text-align:center}
  header img{max-height:90px;max-width:200px;display:block;margin:0 auto 10px;background:#fff;border-radius:12px;padding:6px}
  .ph{width:84px;height:84px;margin:0 auto 10px;border:2px dashed rgba(255,255,255,.6);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:11px;opacity:.8}
  header h1{margin:0;font-size:21px;font-weight:800}
  header p{margin:6px 0 0;font-size:13.5px;opacity:.9}
  .wrap{max-width:760px;margin:0 auto;padding:16px 12px 40px}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
  h2{font-size:15px;margin:0 0 12px;color:var(--g)}
  label{font-size:12.5px;font-weight:600;display:block;margin:0 0 5px}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r);font:inherit;font-size:15px;margin-bottom:12px;background:#fff}
  textarea{min-height:70px;resize:vertical}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  @media(max-width:560px){.g2{grid-template-columns:1fr}}
  button{padding:12px 18px;border:none;border-radius:var(--r);background:var(--g);color:#fff;font:inherit;font-weight:700;font-size:14.5px;cursor:pointer}
  button.sec{background:#fff;color:var(--g);border:1px solid var(--g)}
  button.del{background:#fff;color:#a32d2d;border:1px solid #e3b4b4;padding:6px 12px;font-size:12.5px}
  button:disabled{opacity:.6}
  .part{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;background:#fafcfa}
  .part .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700;font-size:14px}
  .st{font-size:11.5px;padding:2px 9px;border-radius:99px;background:#eee;font-weight:600}
  .msg{padding:14px;border-radius:var(--r);text-align:center;line-height:1.8;font-size:14px}
  .err{background:#FCEBEB;color:#791F1F;border:1px solid #F3C5C5;margin-top:10px}
  .info{background:#FFF8E5;color:#6b4e00;border:1px solid #F0DDA8}
  .ok{background:#EAF7EE;border:1px solid #BFE5CB}
  .ref{font-size:22px;font-weight:800;color:var(--g);letter-spacing:1px}
  .linkbox{direction:ltr;text-align:left;font-size:12px;word-break:break-all;background:#f4f6f4;padding:8px;border-radius:8px;margin:8px 0}
</style>
</head>
<body>
<header id="hdr"><div class="ph">الشعار</div><h1>مهرجان الجامعات الأردنية للفن والثقافة</h1><p id="sub"></p></header>
<div class="wrap" id="app"><div class="msg">جارٍ التحميل...</div></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOKEN = new URLSearchParams(location.search).get('t') || '';
let INFO = null, EDIT = null, CAP = null, PARTS = [], PSEQ = 0;

async function j(url, method, body) {
  const r = await fetch(url, { method: method || 'GET', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  let d; try { d = await r.json(); } catch (e) { d = { error: 'خطأ في الاتصال بالخادم' }; }
  return d;
}
function fmtD(d) { try { return new Date(d + 'T00:00:00').toLocaleDateString('ar-JO', { year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) { return d; } }

async function init() {
  INFO = await j('/api/public/festival/info');
  if (INFO.error) { $('app').innerHTML = `<div class="msg err">${esc(INFO.error)}</div>`; return; }
  document.documentElement.style.setProperty('--g', INFO.color || '#0F5132');
  $('hdr').innerHTML = (INFO.logo ? `<img src="${esc(INFO.logo)}" alt="">` : '<div class="ph">الشعار</div>') + `<h1>${esc(INFO.title)}</h1><p>${esc(INFO.subtitle)}</p>`;
  document.title = INFO.title;
  let state = INFO.state;
  if (TOKEN) {
    EDIT = await j('/api/public/festival/submission/' + encodeURIComponent(TOKEN));
    if (EDIT.error) { $('app').innerHTML = `<div class="msg err">${esc(EDIT.error)}</div>`; return; }
    state = EDIT.state;
  }
  const intro = INFO.intro ? `<div class="card" style="white-space:pre-line;font-size:14px;line-height:1.9">${esc(INFO.intro)}</div>` : '';
  const win = INFO.open_date && INFO.close_date ? `<div style="font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:12px">فترة التسجيل: ${fmtD(INFO.open_date)} — ${fmtD(INFO.close_date)}</div>` : '';
  if (state === 'not_yet') { $('app').innerHTML = intro + `<div class="msg info">باب التسجيل لم يُفتح بعد.<br>سيفتح بتاريخ <b>${fmtD(INFO.open_date)}</b></div>`; return; }
  if (state === 'closed') {
    $('app').innerHTML = intro + `<div class="msg info">انتهى باب التسجيل في المهرجان.</div>` + (EDIT ? viewOnly() : '');
    return;
  }
  $('app').innerHTML = intro + win + formHtml();
  PARTS = EDIT ? EDIT.participations.map(p => ({ ...p, _k: ++PSEQ })) : [{ _k: ++PSEQ }];
  renderParts();
  if (!EDIT) loadCap();
}
function viewOnly() {
  return `<div class="card"><h2>مشاركات ${esc(EDIT.university)} (${esc(EDIT.ref)})</h2>` + EDIT.participations.map(p => `<div class="part"><b>${esc(p.title)}</b> — ${esc(p.field === 'أخرى' ? p.other_text : p.field)}</div>`).join('') + `</div>`;
}
function formHtml() {
  const c = EDIT ? EDIT.contact : {};
  return `<div class="card"><h2>${EDIT ? '✏️ تعديل الطلب ' + esc(EDIT.ref) : '١. الجامعة'}</h2>
    <label>الجامعة *</label>
    ${EDIT ? `<input value="${esc(EDIT.university)}" disabled>` : `<select id="f-uni"><option value="">— اختر الجامعة —</option>${INFO.universities.map(u => `<option>${esc(u)}</option>`).join('')}</select>`}
    </div>
  <div class="card"><h2>٢. المسؤول عن التواصل</h2><div class="g2">
    <div><label>الاسم *</label><input id="f-cn" value="${esc(c.name)}"></div>
    <div><label>المسمى الوظيفي *</label><input id="f-ct" value="${esc(c.title)}"></div>
    <div><label>رقم الهاتف *</label><input id="f-cp" type="tel" inputmode="tel" value="${esc(c.phone)}"></div>
    <div><label>البريد الإلكتروني *</label><input id="f-ce" type="email" dir="ltr" value="${esc(c.email)}"></div></div></div>
  <div class="card"><h2>٣. المشاركات</h2><div id="parts"></div>
    <button class="sec" type="button" onclick="addPart()">＋ إضافة مشاركة أخرى</button></div>
  <div class="card"><h2>٤. ملاحظات</h2><textarea id="f-notes" placeholder="أي ملاحظات إضافية (اختياري)">${esc(EDIT ? EDIT.notes : '')}</textarea></div>
  ${EDIT ? '' : `<div class="card"><label>التحقق: <span id="cap-q"></span> *</label><input id="f-cap" inputmode="numeric" style="max-width:160px"></div>`}
  <div style="text-align:center"><button id="sbtn" onclick="submitForm()" style="min-width:200px">${EDIT ? 'حفظ التعديلات' : 'إرسال الطلب'}</button><div id="ferr"></div></div>`;
}
async function loadCap() { CAP = await j('/api/public/captcha'); if ($('cap-q')) $('cap-q').textContent = CAP.question || ''; }
function collect() { PARTS.forEach(p => { ['field','other_text','title','description','duration_min','students_count','tech_needs'].forEach(k => { const e = $('p-' + k + '-' + p._k); if (e) p[k] = e.value; }); }); }
function addPart() { collect(); if (PARTS.length >= 20) return; PARTS.push({ _k: ++PSEQ }); renderParts(); }
function delPart(k) { collect(); if (PARTS.length < 2) return; PARTS = PARTS.filter(p => p._k !== k); renderParts(); }
function renderParts() {
  $('parts').innerHTML = PARTS.map((p, i) => { const k = p._k;
    return `<div class="part"><div class="hd"><span>المشاركة ${i + 1} ${p.status ? `<span class="st">${esc(p.status)}</span>` : ''}</span>${PARTS.length > 1 ? `<button class="del" type="button" onclick="delPart(${k})">حذف</button>` : ''}</div>
    <div class="g2"><div><label>المجال *</label><select id="p-field-${k}" onchange="collect();renderParts()"><option value="">— اختر —</option>${INFO.fields.map(f => `<option ${p.field === f ? 'selected' : ''}>${f}</option>`).join('')}</select></div>
    ${p.field === 'أخرى' ? `<div><label>نوع المشاركة *</label><input id="p-other_text-${k}" value="${esc(p.other_text)}"></div>` : '<div></div>'}</div>
    <label>عنوان المشاركة *</label><input id="p-title-${k}" value="${esc(p.title)}">
    <label>وصف مختصر</label><textarea id="p-description-${k}">${esc(p.description)}</textarea>
    <div class="g2"><div><label>المدة (بالدقائق) *</label><input id="p-duration_min-${k}" type="number" min="1" max="600" inputmode="numeric" value="${esc(p.duration_min)}"></div>
    <div><label>عدد الطلبة المشاركين *</label><input id="p-students_count-${k}" type="number" min="1" max="500" inputmode="numeric" value="${esc(p.students_count)}"></div></div>
    <label>الاحتياجات الفنية (صوت، إضاءة، أجهزة، مستلزمات عرض...)</label><textarea id="p-tech_needs-${k}">${esc(p.tech_needs)}</textarea></div>`; }).join('');
}
async function submitForm() {
  collect();
  const body = { contact: { name: $('f-cn').value, title: $('f-ct').value, phone: $('f-cp').value, email: $('f-ce').value }, notes: $('f-notes').value,
    participations: PARTS.map(p => ({ pid: p.pid, field: p.field, other_text: p.other_text, title: p.title, description: p.description, duration_min: p.duration_min, students_count: p.students_count, tech_needs: p.tech_needs })) };
  if (!EDIT) { body.university = $('f-uni').value; body.captcha_token = CAP && CAP.token; body.captcha_answer = $('f-cap').value; }
  $('sbtn').disabled = true; $('ferr').innerHTML = '';
  const r = await j(EDIT ? '/api/public/festival/submission/' + encodeURIComponent(TOKEN) : '/api/public/festival/submit', EDIT ? 'PUT' : 'POST', body);
  $('sbtn').disabled = false;
  if (r.error) { $('ferr').innerHTML = `<div class="msg err">${esc(r.error)}</div>`; if (!EDIT) { loadCap(); $('f-cap').value = ''; } return; }
  const link = location.origin + '/festival.html?t=' + (r.edit_token || TOKEN);
  $('app').innerHTML = `<div class="card msg ok"><div style="font-size:38px">✅</div><b>${EDIT ? 'تم حفظ التعديلات' : 'تم استلام طلبكم'}</b><div>الرقم المرجعي</div><div class="ref">${esc(r.ref)}</div>
    <div style="font-size:13px">ستقوم لجنة المهرجان بدراسة المشاركات وإعلامكم بالقرار.</div>
    ${r.edit_token ? `<div style="font-size:13px;margin-top:10px">يمكنكم تعديل الطلب حتى إغلاق باب التسجيل عبر الرابط التالي — <b>احتفظوا به</b>${r.emailed ? ' (أُرسل أيضاً إلى بريدكم)' : ''}:</div><div class="linkbox">${esc(link)}</div><button class="sec" onclick="navigator.clipboard.writeText('${link}');this.textContent='تم النسخ ✓'">نسخ الرابط</button>` : ''}</div>`;
  window.scrollTo(0, 0);
}
init();
</script>
</body>
</html>
